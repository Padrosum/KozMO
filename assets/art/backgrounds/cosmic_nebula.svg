<svg xmlns="http://www.w3.org/2000/svg" width="2400" height="2400" viewBox="0 0 2400 2400">
  <defs>
    <radialGradient id="violet" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#7438b8" stop-opacity=".42"/>
      <stop offset=".28" stop-color="#542b91" stop-opacity=".28"/>
      <stop offset=".62" stop-color="#38205f" stop-opacity=".12"/>
      <stop offset="1" stop-color="#261640" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="teal" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#1b8c88" stop-opacity=".34"/>
      <stop offset=".34" stop-color="#176c73" stop-opacity=".22"/>
      <stop offset=".72" stop-color="#123b54" stop-opacity=".09"/>
      <stop offset="1" stop-color="#102638" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="gold" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#b87b36" stop-opacity=".22"/>
      <stop offset=".38" stop-color="#805a37" stop-opacity=".14"/>
      <stop offset="1" stop-color="#503b35" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="rose" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#9b315f" stop-opacity=".25"/>
      <stop offset=".42" stop-color="#67274f" stop-opacity=".15"/>
      <stop offset="1" stop-color="#3b1d3b" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="filament" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9a68d8" stop-opacity="0"/>
      <stop offset=".45" stop-color="#7c83c9" stop-opacity=".17"/>
      <stop offset=".72" stop-color="#58c7c0" stop-opacity=".12"/>
      <stop offset="1" stop-color="#58c7c0" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Broad, overlapping clouds keep the map atmospheric without obscuring labels. -->
  <g opacity=".92">
    <ellipse cx="1100" cy="1180" rx="820" ry="430" fill="url(#violet)" transform="rotate(-31 1100 1180)"/>
    <ellipse cx="1530" cy="900" rx="620" ry="300" fill="url(#teal)" transform="rotate(-28 1530 900)"/>
    <ellipse cx="820" cy="1460" rx="540" ry="250" fill="url(#rose)" transform="rotate(-35 820 1460)"/>
    <ellipse cx="1470" cy="1450" rx="590" ry="260" fill="url(#gold)" transform="rotate(-25 1470 1450)"/>
    <ellipse cx="1840" cy="1660" rx="580" ry="300" fill="url(#violet)" transform="rotate(-38 1840 1660)"/>
    <ellipse cx="540" cy="760" rx="510" ry="270" fill="url(#teal)" transform="rotate(-22 540 760)"/>
  </g>

  <!-- Fine nebula filaments add structure when zoomed out, but remain low contrast. -->
  <g fill="none" stroke="url(#filament)" stroke-linecap="round">
    <path d="M180 1580 C510 1260 680 1340 940 1090 S1390 720 1770 760" stroke-width="3"/>
    <path d="M430 1770 C760 1460 950 1530 1210 1260 S1600 930 2020 990" stroke-width="2"/>
    <path d="M360 650 C700 850 820 720 1100 900 S1510 1240 1900 1180" stroke-width="2"/>
    <path d="M700 2050 C960 1740 1220 1790 1430 1530 S1760 1300 2140 1340" stroke-width="2"/>
  </g>
</svg>
