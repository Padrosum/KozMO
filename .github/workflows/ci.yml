name: KozMO CI & Release Build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-and-test:
    name: Format, Clippy & Unit Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies for Bevy
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libudev-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting (cargo fmt)
        run: cargo fmt --all -- --check

      - name: Run Clippy lints (cargo clippy)
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

      - name: Run workspace unit & integration tests (cargo test)
        run: cargo test --locked --workspace

  build-release:
    name: Build Release Package (${{ matrix.os }})
    needs: check-and-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: KozMO-linux-x86_64
            bin_name: dominion-game
            archive_ext: tar.gz
          - os: windows-latest
            artifact_name: KozMO-windows-x86_64
            bin_name: dominion-game.exe
            archive_ext: zip
          - os: macos-latest
            artifact_name: KozMO-macos-arm64
            bin_name: dominion-game
            archive_ext: tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libx11-dev \
            libxi-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libasound2-dev \
            libudev-dev

      - name: Install Rust stable toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build optimized release binary
        run: cargo build --locked --release -p dominion-game

      - name: Package release bundle (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist/${{ matrix.artifact_name }}
          cp target/release/${{ matrix.bin_name }} dist/${{ matrix.artifact_name }}/
          cp -r assets dist/${{ matrix.artifact_name }}/
          cp README.md REHBER.md LICENSE dist/${{ matrix.artifact_name }}/
          tar -czf ${{ matrix.artifact_name }}.tar.gz -C dist ${{ matrix.artifact_name }}

      - name: Package release bundle (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "dist/${{ matrix.artifact_name }}"
          Copy-Item "target/release/${{ matrix.bin_name }}" "dist/${{ matrix.artifact_name }}/"
          Copy-Item -Recurse "assets" "dist/${{ matrix.artifact_name }}/"
          Copy-Item "README.md", "REHBER.md", "LICENSE" "dist/${{ matrix.artifact_name }}/"
          Compress-Archive -Path "dist/${{ matrix.artifact_name }}" -DestinationPath "${{ matrix.artifact_name }}.zip"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}

      - name: Publish GitHub Release on version tags
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact_name }}.${{ matrix.archive_ext }}
          generate_release_notes: true
